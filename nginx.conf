# Static-serving config for the VetCare marketing site container.
# The VPS front nginx terminates TLS and proxies the marketing domain to this
# container — here we only serve files.

# Blog images: every URL the pages use carries ?v=<hash of the file's bytes> (scripts/build-blog.js),
# so a replaced image is a new URL and a cached copy can never go stale — those get a year and
# `immutable`. A request without ?v= (a hand-typed or hotlinked URL) has no such guarantee and keeps
# the same hour as /assets/. map{} sits outside server{}: this file is included in the http block.
map $arg_v $vc_blog_image_cache {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # never expose directory listings
    autoindex off;

    # Redirects carry a relative Location (/blog, not http://<host>:80/blog). This container only
    # sees plain HTTP from the front nginx, so an absolute one would send visitors to http:// and
    # cost them an extra hop back to https.
    absolute_redirect off;

    # compress text assets on the fly
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml;

    # HTML is served fresh (must-revalidate) so a redeploy is picked up immediately
    location = /index.html   { add_header Cache-Control "no-cache"; }
    location = /privacy.html { add_header Cache-Control "no-cache"; }

    # branded 404 instead of nginx's bare default; internal so /404.html itself isn't a reachable URL
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache"; }

    # built assets aren't content-hashed, so a moderate cache with revalidation
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Blog, generated by scripts/build-blog.js into /blog/. Each page has exactly one public URL —
    # /blog and /blog/<slug>, no extension, no trailing slash — which is what the canonical tags and
    # sitemap.xml say, so every other spelling of it redirects there instead of serving a duplicate.
    location = /blog {
        try_files /blog/index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /blog/           { return 301 /blog; }
    location = /blog/index.html { return 301 /blog; }
    location /blog/ {
        rewrite ^/blog/(.+)\.html$ /blog/$1 permanent;
        rewrite ^/blog/(.+)/$ /blog/$1 permanent;
        try_files $uri.html =404;
        add_header Cache-Control "no-cache";
    }
    location /blog/images/ {
        add_header Cache-Control $vc_blog_image_cache;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
