# Static-serving config for the VetCare marketing site container.
# The VPS front nginx terminates TLS and proxies the marketing domain to this
# container — here we only serve files.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # never expose directory listings
    autoindex off;

    # compress text assets on the fly
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml;

    # HTML is served fresh (must-revalidate) so a redeploy is picked up immediately
    location = /index.html   { add_header Cache-Control "no-cache"; }
    location = /privacy.html { add_header Cache-Control "no-cache"; }

    # built assets aren't content-hashed, so a moderate cache with revalidation
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
